version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: github-discord-notifier-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=github_discord_notifier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - notifier-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: github-discord-notifier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - notifier-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/GitHubDiscordNotifier.Api/Dockerfile
    container_name: github-discord-notifier-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=github_discord_notifier;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__SecretKey=ThisIsAVerySecureSecretKeyForJWTTokenGenerationPleaseChangeInProduction
      - Frontend__Url=http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - notifier-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: github-discord-notifier-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - notifier-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: github-discord-notifier-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - notifier-network

networks:
  notifier-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: